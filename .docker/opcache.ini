; ── OPcache Configuration ────────────────────────────────────────────────────
; Caches compiled PHP bytecode in shared memory.
; Result: eliminates re-compilation on every request (~5-10ms saved per call).

opcache.enable=1
opcache.enable_cli=0

; Memory allocated for bytecode cache (MB)
opcache.memory_consumption=128

; Memory for interned strings (MB)
opcache.interned_strings_buffer=16

; Max files to cache (set higher than your file count)
opcache.max_accelerated_files=4000

; Recheck file timestamps every N seconds
; 2 = good for dev (changes picked up within 2s, no per-request stat() overhead)
opcache.revalidate_freq=2
opcache.validate_timestamps=1

; Free memory on each request end (faster shutdown)
opcache.fast_shutdown=1

; JIT disabled — I/O-bound APIs (DB + network) gain nothing from JIT.
; JIT benefits CPU-heavy workloads (math, image processing) only.
opcache.jit=off
opcache.jit_buffer_size=0
